name: Publish MedSync QA image to private registry

on:
  push:
    branches: [develop, codex/medsync-qa-registry-smoke]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medsync-qa-registry
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/codex/medsync-qa-registry-smoke'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:isolated

  publish:
    needs: test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/codex/medsync-qa-registry-smoke'
    environment: qa-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, push and report digest
        env:
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${REGISTRY_USERNAME:?Missing REGISTRY_USERNAME}" "${REGISTRY_PASSWORD:?Missing REGISTRY_PASSWORD}"
          registry=registry.hemia.cloud
          image="$registry/medsync/qa-backend"
          tag="qa-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/medsync-registry.XXXXXX")"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$registry" \
            --username "$REGISTRY_USERNAME" --password-stdin
          unset REGISTRY_PASSWORD

          metadata="$DOCKER_CONFIG/build-metadata.json"
          docker buildx build --platform linux/amd64 --provenance=false --push \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$tag" --metadata-file "$metadata" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$metadata")"
          printf 'QA image: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
