name: MedSync backend releases

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: medsync-backend-stable
  cancel-in-progress: false
  queue: max

jobs:
  classify:
    if: github.repository == 'hemia-labs/medsync-back-legacy'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.batch.outputs.release }}
      tag: ${{ steps.batch.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify a Changesets version merge
        id: batch
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/ops/classify-prod-release.js "$BASE_SHA" >> "$GITHUB_OUTPUT"

  version-pr:
    needs: classify
    if: needs.classify.outputs.release == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Check whether this run can update the version PR
        if: hashFiles('.changeset/*.md', '!.changeset/README.md') != ''
        id: head
        run: |
          if [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.current == 'true'
        run: npm ci --ignore-scripts
      - name: Create a hemia-ci installation token
        if: steps.head.outputs.current == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare the stable version PR
        if: steps.head.outputs.current == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commitMode: github-api
          version: npm run version-packages
          title: "Release: versionar backend"
          commit: "Release: versionar backend"

  publish:
    needs: classify
    if: needs.classify.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-prod-image.yml
    with:
      release_tag: ${{ needs.classify.outputs.tag }}
