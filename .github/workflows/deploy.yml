name: Deploy medsync-back-legacy to Contabo prod

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VPS_HOST: 195.26.247.210
  NODE_VERSION: 22
  APP_NAME: medsync-back-legacy

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  isolated-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:isolated

  build-and-deploy:
    needs: isolated-regressions
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      # No hay paso de "build": el proyecto es JavaScript plano (CommonJS).
      # El artefacto de despliegue es src/ + package.json + package-lock.json
      # + ecosystem.config.cjs. El VPS aporta el entorno e instala las dependencias.

      - name: Validate deployment configuration
        env:
          VPS_HOST: ${{ env.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          node <<'NODE'
          const requiredKeys = ['VPS_HOST', 'VPS_USER', 'VPS_SSH_KEY', 'VPS_KNOWN_HOSTS', 'VPS_APP_DIR'];
          const missingKeys = requiredKeys.filter((key) => !process.env[key]);

          if (missingKeys.length > 0) {
            console.error(`Missing GitHub secrets: ${missingKeys.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Transfer and activate with verified OpenSSH
        env:
          VPS_HOST: ${{ env.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          APP_PORT: ${{ secrets.APP_PORT || '3009' }}
          RELEASE_ENV_SOURCE: production
        run: bash scripts/ops/upload-release.sh
