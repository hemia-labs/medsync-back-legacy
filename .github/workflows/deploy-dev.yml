name: Deploy MedSync QA to Hemia VPS DEV

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      operation:
        description: QA operation
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

concurrency:
  group: medsync-qa-registry
  cancel-in-progress: false

jobs:
  test:
    if: inputs.operation != 'rollback'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:isolated

  deploy:
    needs: test
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/develop' &&
      (needs.test.result == 'success' || inputs.operation == 'rollback') }}
    environment: qa-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, push and report digest
        id: image
        if: inputs.operation != 'rollback'
        env:
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${REGISTRY_USERNAME:?Missing REGISTRY_USERNAME}" "${REGISTRY_PASSWORD:?Missing REGISTRY_PASSWORD}"
          registry=registry.hemia.cloud
          image="$registry/medsync/qa-backend"
          tag="qa-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/medsync-registry.XXXXXX")"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$registry" \
            --username "$REGISTRY_USERNAME" --password-stdin
          unset REGISTRY_PASSWORD

          metadata="$DOCKER_CONFIG/build-metadata.json"
          docker buildx build --platform linux/amd64 --provenance=false --push \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$tag" --metadata-file "$metadata" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$metadata")"
          printf 'QA image: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy or roll back QA on port 3009
        env:
          QA_SSH_KEY: ${{ secrets.QA_SSH_KEY }}
          QA_KNOWN_HOSTS: ${{ secrets.QA_KNOWN_HOSTS }}
          QA_OPERATION: ${{ inputs.operation || 'deploy' }}
          QA_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          : "${QA_SSH_KEY:?Missing QA_SSH_KEY}" "${QA_KNOWN_HOSTS:?Missing QA_KNOWN_HOSTS}"
          umask 077
          auth_dir="$(mktemp -d "$RUNNER_TEMP/medsync-ssh.XXXXXX")"
          trap 'rm -rf -- "$auth_dir"' EXIT
          printf '%s\n' "$QA_SSH_KEY" > "$auth_dir/key"
          printf '%s\n' "$QA_KNOWN_HOSTS" > "$auth_dir/known_hosts"
          unset QA_SSH_KEY QA_KNOWN_HOSTS
          if [[ "$QA_OPERATION" == rollback ]]; then
            command=rollback
          else
            [[ "$QA_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            command="deploy $QA_DIGEST"
          fi
          ssh -n -i "$auth_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$auth_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            root@185.187.235.117 "$command" | tee "$auth_dir/result"
          image="$(sed -n 's/^QA_RESULT_IMAGE=//p' "$auth_dir/result")"
          [[ "$image" =~ ^registry\.hemia\.cloud/medsync/qa-backend@sha256:[a-f0-9]{64}$ ]]
          if [[ "$QA_OPERATION" != rollback ]]; then [[ "$image" == *"@$QA_DIGEST" ]]; fi
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --max-time 8 \
            https://api-test.medsync.mx/readyz |
            jq -e --arg image "$image" '.ready == true and .release == $image'
          printf 'QA active: `%s` on port 3009.\n' "$image" >> "$GITHUB_STEP_SUMMARY"

  prerelease:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish prerelease notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-backend.sh
